[project]
name = "memorydock-gateway"
version = "0.1.0"
description = "memorydock gateway: REST API and MCP server"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.163",
    "fastmcp>=4.2,<5",
    "mcp>=2.3",
    "memorydock-core",
    "pydantic>=2.14",
    "pymongo>=4.20",
    "starlette>=1.10",
    "uvicorn[standard]>=0.54",
]

[tool.deptry.per_rule_ignores]
# The server process, run from the command line rather than imported.
DEP002 = ["uvicorn"]

[tool.uv.sources]
memorydock-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memorydock_gateway"]
