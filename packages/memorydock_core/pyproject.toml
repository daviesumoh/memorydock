[project]
name = "memorydock-core"
version = "0.1.0"
description = "Domain core for memorydock: settings, database access and services"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "pymongo>=4.20",
    "python-ulid>=4.1",
    "rfc8785>=0.1",
    "cedarpy>=4.12",
    "httpx>=0.28",
    "langmem>=0.0.30",
    "langchain-openai>=1.8.0",
]

[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memorydock_core"]
