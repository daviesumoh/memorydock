name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --all-packages
      - run: make lint
      - run: make scan
      - run: make privacy
      - run: make test

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongodb:
        # Atlas Local has no embedding model, so these tests skip search indexes; search is
        # checked against the live cluster.
        image: mongodb/mongodb-atlas-local:9.0.4
        ports:
          - 27017:27017
    env:
      ENV: dev
      MONGODB_URI_ADMIN: mongodb://localhost:27017/?directConnection=true
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --all-packages
      - name: Wait for MongoDB
        run: |
          for i in $(seq 1 60); do
            uv run python -c "from pymongo import MongoClient; MongoClient('$MONGODB_URI_ADMIN', serverSelectionTimeoutMS=2000).admin.command('ping')" && exit 0
            sleep 3
          done
          exit 1
      - run: make test-integration

  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            git log -1 --format=%B "$HEAD" > "$RUNNER_TEMP/messages"
          else
            git log "$BASE..$HEAD" --format=%B > "$RUNNER_TEMP/messages"
          fi
          uv run --no-project python scripts/check_attribution.py "$RUNNER_TEMP/messages"
      - name: PR body
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/pr_body"
          uv run --no-project python scripts/check_attribution.py "$RUNNER_TEMP/pr_body"
